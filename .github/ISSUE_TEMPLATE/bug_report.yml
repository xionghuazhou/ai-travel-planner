name: Bug report
description: Report a reproducible problem with TravelAI
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.1.0 or commit hash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment and LLM provider
      placeholder: Docker/local, Python version, model name (no API keys!)
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include configuration, user input and exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Paste sanitized logs; remove API keys, tokens and personal data.
    validations:
      required: true